name: Release RPMs (openSUSE)

# Builda o RPM do tema a partir do spec em packaging/opensuse/.
# O envio pro openSUSE Build Service (home:rodrigosbrito:lyra/lyra-theme) é
# manual via `osc service manualrun` + `osc commit` — não roda mais daqui.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
      - name: Instalar dependências de build
        run: |
          zypper --non-interactive install -y tar gzip git python3 python3-gobject rsvg-convert \
            cantarell-fonts rpm-build rpmdevtools

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Buildar os RPMs
        run: |
          version="${GITHUB_REF_NAME#v}"
          rpmdev-setuptree
          # Os specs usam a mesma nomenclatura versionada do serviço tar_scm
          # no OBS. Substituir a versão literal apenas na cópia usada pelo
          # rpmbuild mantém o spec compatível com o serviço set_version.
          sed -i -E "s/^Version:[[:space:]]+.*/Version:        $version/" \
            packaging/opensuse/lyra-os-theme.spec
          tar czf "$HOME/rpmbuild/SOURCES/lyra-theme-src-$version.tar.gz" \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='Lyra-OS.tar.xz' \
            .
          rpmbuild -bb --define "version $version" packaging/opensuse/lyra-os-theme.spec

      - name: Coletar RPMs finais (sem debuginfo/debugsource)
        run: |
          mkdir -p rpms
          find "$HOME/rpmbuild/RPMS/noarch" -maxdepth 1 -name '*.rpm' \
            ! -name '*debuginfo*' ! -name '*debugsource*' -exec cp {} rpms/ \;
          ls -lh rpms/

      - name: Validar instalação
        run: |
          rpm -Uvh --nodeps rpms/*.rpm
          test -f /usr/share/plymouth/themes/Lyra-OS/Lyra-OS.plymouth
          test -f /usr/share/plymouth/themes/Lyra-OS/watermark.png
          grep -Fqx 'ModuleName=two-step' \
            /usr/share/plymouth/themes/Lyra-OS/Lyra-OS.plymouth
          test -x /usr/lib/dracut/modules.d/51lyra-plymouth/module-setup.sh
          test -f /usr/share/grub/themes/Lyra-OS/theme.txt
          test -f /usr/share/glib-2.0/schemas/99-lyra-os.gschema.override
          test -x /usr/libexec/lyra-os-apply-full-theme
          test -f /etc/xdg/autostart/lyra-os-full-theme.desktop
          test ! -d /usr/share/themes/Lyra-OS
          test ! -d /usr/share/themes/Lyra-OS-Light
          grep -Fqx "picture-uri='file:///usr/share/backgrounds/lyra/2702-voyage.png'" \
            /usr/share/glib-2.0/schemas/99-lyra-os.gschema.override
          grep -Fqx "picture-uri-dark='file:///usr/share/backgrounds/lyra/2702-voyage.png'" \
            /usr/share/glib-2.0/schemas/99-lyra-os.gschema.override
          test -f /etc/skel/.config/neofetch/config.conf
          test -f /etc/skel/.config/fastfetch/config.jsonc
          test -f /usr/share/lyra-os-theme/fastfetch/logo.txt
          grep -Fqx 'GRUB_THEME="/usr/share/grub/themes/Lyra-OS/theme.txt"' \
            /etc/default/grub
          test "$(plymouth-set-default-theme)" = Lyra-OS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opensuse-rpms
          path: rpms/*.rpm

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: opensuse-rpms
          path: rpms

      - name: Publicar RPMs na release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" rpms/*.rpm --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
