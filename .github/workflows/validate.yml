name: validate
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
      - run: zypper --non-interactive install tar xz git sassc ImageMagick nodejs rsvg-convert cantarell-fonts
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - run: bash -n install-rpm.sh
      - run: ./scripts/test-i18n.sh
      - run: ./scripts/build.sh
      - run: ./scripts/build-wallpaper-variants.sh
      - run: |
          test -f dist/backgrounds/lyra-voyage.png
          test -f dist/backgrounds/lyra-voyage.jxl
          test "$(find dist/backgrounds -maxdepth 1 -name '*.png' | wc -l)" -eq 11
          test "$(find dist/backgrounds -maxdepth 1 -name '*.jxl' | wc -l)" -eq 11
          grep -Fqx "picture-uri='file:///usr/share/backgrounds/lyra/lyra-voyage.png'" \
            src/defaults/99-lyra-os.gschema.override
          grep -Fqx "picture-uri-dark='file:///usr/share/backgrounds/lyra/lyra-voyage.png'" \
            src/defaults/99-lyra-os.gschema.override
          grep -Fqx 'ModuleName=two-step' dist/plymouth/Lyra-OS/Lyra-OS.plymouth
          test -f dist/plymouth/Lyra-OS/watermark.png
          test -x dist/dracut/51lyra-plymouth/module-setup.sh
          bash -n dist/dracut/51lyra-plymouth/module-setup.sh
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Lyra-OS
          path: Lyra-OS.tar.xz
