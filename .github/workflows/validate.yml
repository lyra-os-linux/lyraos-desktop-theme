name: validate
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
      - run: zypper --non-interactive install git sassc ImageMagick nodejs rsvg-convert cantarell-fonts
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash -n install-rpm.sh src/defaults/lyra-os-apply-full-theme
      - run: ./scripts/test-i18n.sh
      - run: ./scripts/build.sh
      - run: |
          test -f dist/Lyra-OS/gnome-shell/gnome-shell.css
          test -f dist/Lyra-OS-Light/gnome-shell/gnome-shell.css
          test -f dist/plymouth/Lyra-OS/watermark.png
          test -x dist/dracut/51lyra-plymouth/module-setup.sh
          grep -Fqx "picture-uri='file:///usr/share/backgrounds/lyra/2702-voyage.png'" \
            src/defaults/99-lyra-os.gschema.override
