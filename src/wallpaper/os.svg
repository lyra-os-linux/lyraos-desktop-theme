    <path fill="url(#lyraMark)" d="M104 190A140 140 0 0 0 199 56 96 96 0 0 1 104 190Z"/>
    <path fill="none" stroke="url(#lyraMark)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
          d="M150 14C118 14 96 34 92 62L92 150C92 166 86 176 76 180 68 183 62 180 60 174"/>
    <g stroke="url(#lyraMark)" stroke-width="4" stroke-linecap="round">
