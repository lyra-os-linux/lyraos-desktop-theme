<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <title>Lyra OS</title>
  <desc>Flat angular corporate wallpaper for Lyra OS, with an aurora brand glow. Depicts the "Odisseia" journey: a boat sailing past flat silhouette characters from the Odyssey (a Siren, the Cyclops, Circe, Scylla and Charybdis, Calypso) toward home.</desc>
  <defs>
    <linearGradient id="lyraMark" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="210" y2="200">
      <stop offset="0%" stop-color="@ENT_BRAND_START@"/>
      <stop offset="100%" stop-color="@ENT_BRAND_END@"/>
    </linearGradient>
    <linearGradient id="auroraGlowA" gradientUnits="userSpaceOnUse" x1="-200" y1="-260" x2="1900" y2="760">
      <stop offset="0%" stop-color="@ENT_BRAND_START@" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="@ENT_BRAND_END@" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="@ENT_BRAND_END@" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraGlowB" gradientUnits="userSpaceOnUse" x1="2200" y1="1040" x2="3980" y2="1980">
      <stop offset="0%" stop-color="@ENT_BRAND_END@" stop-opacity="0"/>
      <stop offset="55%" stop-color="@ENT_BRAND_END@" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="@ENT_BRAND_START@" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="auroraBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="170"/>
    </filter>
    <linearGradient id="bodyShade" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="@ENT_TEXT@" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="@ENT_TEXT@" stop-opacity="0"/>
      <stop offset="100%" stop-color="@ENT_BG@" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="3840" height="2160" fill="@ENT_BG@"/>
  <g opacity="@ENT_GLOW_OPACITY@" filter="url(#auroraBlur)">
    <ellipse cx="640" cy="220" rx="1500" ry="640" fill="url(#auroraGlowA)" transform="rotate(-9 640 220)"/>
    <ellipse cx="3220" cy="1760" rx="1300" ry="620" fill="url(#auroraGlowB)" transform="rotate(-9 3220 1760)"/>
  </g>
  <g fill="none" stroke="@ENT_BORDER@" stroke-width="2" opacity="0.46">
    <path d="M0 310H920L1280 670H2140L2500 310H3840"/>
    <path d="M0 720H640L1050 1130H1950L2320 760H3840"/>
    <path d="M0 1650H760L1170 1240H2110L2520 1650H3840"/>
    <path d="M0 1980H1120L1450 1650H2240L2570 1980H3840"/>
  </g>
  <g fill="@ENT_SURFACE@" opacity="0.72">
    <path d="M0 0h1210L790 420H0z"/>
    <path d="M3840 2160H2580l430-430h830z"/>
  </g>
  <g fill="url(#lyraMark)" opacity="0.5">
    <path d="M3260 470l6 20 20 6-20 6-6 20-6-20-20-6 20-6Z"/>
    <path d="M560 1480l5 16 16 5-16 5-5 16-5-16-16-5 16-5Z"/>
    <path d="M2860 1240l4 13 13 4-13 4-4 13-4-13-13-4 13-4Z"/>
    <path d="M1660 300l4 13 13 4-13 4-4 13-4-13-13-4 13-4Z"/>
    <path d="M3560 1120l5 16 16 5-16 5-5 16-5-16-16-5 16-5Z"/>
  </g>

  <!-- Odisseia: rota do barco entre os marcos da jornada, até o ponto de
       chegada junto à marca d'água (o "porto" de origem/casa). -->
  <path fill="none" stroke="@ENT_BORDER@" stroke-width="3" stroke-dasharray="18 16" opacity="0.4"
        d="M260 1780C480 1340 640 840 860 640C1120 440 1460 360 1780 340C1980 330 2020 400 2100 480C2220 600 2360 660 2450 720C2650 940 2840 1000 3000 1120C3140 1230 3230 1420 3300 1650"/>

  <!-- Sereia: canto que tenta desviar os navegantes -->
  <g transform="translate(860 640) scale(2.6)" opacity="0.78">
    <path fill="@ENT_BORDER@" d="M-13 -32C-16 -14 -14 6 -7 12L7 12C14 6 16 -14 13 -32C13 -44 -13 -44 -13 -32Z"/>
    <path fill="@ENT_BORDER@" d="M-7 12C-20 20 -30 38 -20 58C-9 46 0 32 0 12Z"/>
    <path fill="@ENT_BORDER@" d="M7 12C20 20 30 38 20 58C9 46 0 32 0 12Z"/>
    <path fill="url(#bodyShade)" d="M-13 -32C-16 -14 -14 6 -7 12L7 12C14 6 16 -14 13 -32C13 -44 -13 -44 -13 -32Z"/>
    <path fill="url(#bodyShade)" d="M-7 12C-20 20 -30 38 -20 58C-9 46 0 32 0 12Z"/>
    <path fill="url(#bodyShade)" d="M7 12C20 20 30 38 20 58C9 46 0 32 0 12Z"/>
    <g fill="none" stroke="@ENT_BORDER@" stroke-width="5" stroke-linecap="round">
      <path d="M-13 -18C-24 -14 -30 -2 -28 8"/>
      <path d="M13 -18C24 -14 30 -2 28 8"/>
    </g>
    <g fill="none" stroke="url(#lyraMark)" stroke-width="2.5" opacity="0.8">
      <path d="M-14 24C-8 28 8 28 14 24"/>
      <path d="M-15 34C-8 39 8 39 15 34"/>
      <path d="M-13 44C-7 48 7 48 13 44"/>
    </g>
    <path fill="url(#lyraMark)" d="M-16 -34C-26 -30 -30 -14 -22 -2C-18 -16 -14 -26 -14 -34Z"/>
    <path fill="url(#lyraMark)" d="M16 -34C26 -30 30 -14 22 -2C18 -16 14 -26 14 -34Z"/>
  </g>

  <!-- Ciclope: Polifemo, o gigante de um olho só, com o porrete erguido -->
  <g transform="translate(1780 340) scale(2.7)" opacity="0.78">
    <path fill="@ENT_BORDER@" d="M-26 44C-34 30 -40 46 -36 58L-20 58C-22 50 -24 46 -26 44Z"/>
    <path fill="@ENT_BORDER@" d="M26 44C34 30 40 46 36 58L20 58C22 50 24 46 26 44Z"/>
    <path fill="@ENT_BORDER@" d="M-32 42C-42 8 -36 -32 0 -36C36 -32 42 8 32 42Z"/>
    <path fill="url(#bodyShade)" d="M-32 42C-42 8 -36 -32 0 -36C36 -32 42 8 32 42Z"/>
    <path fill="url(#lyraMark)" fill-rule="evenodd"
          d="M-15 -8C-8 -19 8 -19 15 -8C8 3 -8 3 -15 -8Z M0 -8A6.5 6.5 0 1 0 0.01 -8Z"/>
    <path fill="none" stroke="@ENT_BORDER@" stroke-width="9" stroke-linecap="round" d="M34 40L50 14"/>
    <ellipse cx="54" cy="4" rx="9" ry="14" fill="@ENT_BORDER@" transform="rotate(-25 54 4)"/>
  </g>

  <!-- Circe: a feiticeira e a taça que transforma os navegantes -->
  <g transform="translate(2100 480) scale(2.7)" opacity="0.78">
    <circle cx="0" cy="-24" r="12" fill="@ENT_BORDER@"/>
    <path fill="@ENT_BORDER@" d="M-20 40C-24 14 -17 -10 0 -10C17 -10 24 14 20 40Z"/>
    <path fill="url(#bodyShade)" d="M-20 40C-24 14 -17 -10 0 -10C17 -10 24 14 20 40Z"/>
    <circle cx="0" cy="-24" r="12" fill="url(#bodyShade)"/>
    <g fill="none" stroke="url(#lyraMark)" stroke-width="2" opacity="0.7">
      <path d="M-10 -2C-14 10 -13 24 -9 36"/>
      <path d="M10 -2C14 10 13 24 9 36"/>
    </g>
    <circle cx="-4" cy="-25" r="2" fill="@ENT_BG@"/>
    <path fill="none" stroke="url(#lyraMark)" stroke-width="6" stroke-linecap="round" d="M12 -8C22 -14 28 -26 24 -36"/>
    <circle cx="25" cy="-38" r="7" fill="url(#lyraMark)"/>
  </g>

  <!-- Cila e Caríbdis: o monstro de várias cabeças sobre o redemoinho -->
  <g transform="translate(2450 720) scale(2.5)" opacity="0.78">
    <path fill="url(#lyraMark)" fill-rule="evenodd"
          d="M0 -24A30 30 0 1 0 0 36A30 30 0 1 0 0 -24Z M0 4A16 16 0 1 1 0 36A16 16 0 1 1 0 4Z"/>
    <g fill="none" stroke="url(#lyraMark)" stroke-width="2" opacity="0.6">
      <path d="M-18 10C-8 16 8 16 18 10"/>
      <path d="M-14 22C-6 26 6 26 14 22"/>
    </g>
    <g fill="none" stroke="@ENT_BORDER@" stroke-width="7" stroke-linecap="round">
      <path d="M-8 4C-16 -16 -10 -36 -20 -50"/>
      <path d="M0 4C0 -20 0 -38 0 -54"/>
      <path d="M8 4C16 -16 10 -36 20 -50"/>
    </g>
    <path fill="url(#lyraMark)" d="M-32 -50L-14 -58L-8 -46L-20 -40Z"/>
    <path fill="url(#lyraMark)" d="M-8 -60L8 -60L6 -46L-6 -46Z"/>
    <path fill="url(#lyraMark)" d="M32 -50L14 -58L8 -46L20 -40Z"/>
  </g>

  <!-- Calipso: a ninfa na última ilha antes do retorno -->
  <g transform="translate(3000 1120) scale(2.4)" opacity="0.74">
    <path fill="@ENT_SURFACE@" d="M-32 22L-6 -20L20 22Z"/>
    <circle cx="-6" cy="-32" r="8" fill="url(#lyraMark)"/>
    <path fill="url(#lyraMark)" d="M-14 -24C-17 -14 -15 -2 -10 2L-2 2C3 -2 5 -14 2 -24Z"/>
    <path fill="url(#bodyShade)" d="M-14 -24C-17 -14 -15 -2 -10 2L-2 2C3 -2 5 -14 2 -24Z"/>
    <path fill="none" stroke="url(#lyraMark)" stroke-width="3" stroke-linecap="round" d="M2 -10C8 -14 10 -20 8 -26"/>
  </g>

  <!-- O barco, em rota entre as Sereias e o Ciclope -->
  <g transform="translate(1400 460) scale(2.2) rotate(-12)" opacity="0.72">
    <path fill="@ENT_BORDER@" stroke="url(#lyraMark)" stroke-width="4" stroke-linejoin="round"
          d="M-52 32L52 32L38 58L-38 58Z"/>
    <path fill="url(#bodyShade)" d="M-52 32L52 32L38 58L-38 58Z"/>
    <path fill="none" stroke="url(#lyraMark)" stroke-width="6" stroke-linecap="round" d="M0 32V-48"/>
    <path fill="url(#lyraMark)" d="M4 -48L36 16L4 16Z"/>
  </g>

  <g transform="translate(3300 1650) scale(2)" opacity="@ENT_WATERMARK_OPACITY@">
    <path fill="url(#lyraMark)" d="M104 190A140 140 0 0 0 199 56 96 96 0 0 1 104 190Z"/>
    <path fill="none" stroke="url(#lyraMark)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
          d="M150 14C118 14 96 34 92 62L92 150C92 166 86 176 76 180 68 183 62 180 60 174"/>
    <g stroke="url(#lyraMark)" stroke-width="4" stroke-linecap="round">
      <path d="M116 46v70M130 46v70M144 46v70M158 46v70"/>
    </g>
    <path fill="url(#lyraMark)" d="M196 18l4 14 14 4-14 4-4 14-4-14-14-4 14-4Z"/>
  </g>
  <text x="3510" y="2100" fill="@ENT_TEXT@" opacity="@ENT_WATERMARK_OPACITY@"
        font-family="sans-serif" font-size="60" font-weight="700" letter-spacing="12"
        text-anchor="middle">1.0</text>
</svg>
