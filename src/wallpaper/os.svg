<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <title>Lyra OS</title>
  <desc>Flat angular corporate wallpaper for Lyra OS, with an aurora brand glow. Depicts the "Odisseia" journey: a boat sailing a route past four waypoints (Sirens, Cyclops, Scylla and Charybdis, Calypso) toward home.</desc>
  <defs>
    <linearGradient id="lyraMark" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="210" y2="200">
      <stop offset="0%" stop-color="@ENT_BRAND_START@"/>
      <stop offset="100%" stop-color="@ENT_BRAND_END@"/>
    </linearGradient>
    <linearGradient id="auroraGlowA" gradientUnits="userSpaceOnUse" x1="-200" y1="-260" x2="1900" y2="760">
      <stop offset="0%" stop-color="@ENT_BRAND_START@" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="@ENT_BRAND_END@" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="@ENT_BRAND_END@" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraGlowB" gradientUnits="userSpaceOnUse" x1="2200" y1="1040" x2="3980" y2="1980">
      <stop offset="0%" stop-color="@ENT_BRAND_END@" stop-opacity="0"/>
      <stop offset="55%" stop-color="@ENT_BRAND_END@" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="@ENT_BRAND_START@" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="auroraBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="170"/>
    </filter>
  </defs>
  <rect width="3840" height="2160" fill="@ENT_BG@"/>
  <g opacity="@ENT_GLOW_OPACITY@" filter="url(#auroraBlur)">
    <ellipse cx="640" cy="220" rx="1500" ry="640" fill="url(#auroraGlowA)" transform="rotate(-9 640 220)"/>
    <ellipse cx="3220" cy="1760" rx="1300" ry="620" fill="url(#auroraGlowB)" transform="rotate(-9 3220 1760)"/>
  </g>
  <g fill="none" stroke="@ENT_BORDER@" stroke-width="2" opacity="0.46">
    <path d="M0 310H920L1280 670H2140L2500 310H3840"/>
    <path d="M0 720H640L1050 1130H1950L2320 760H3840"/>
    <path d="M0 1650H760L1170 1240H2110L2520 1650H3840"/>
    <path d="M0 1980H1120L1450 1650H2240L2570 1980H3840"/>
  </g>
  <g fill="@ENT_SURFACE@" opacity="0.72">
    <path d="M0 0h1210L790 420H0z"/>
    <path d="M3840 2160H2580l430-430h830z"/>
  </g>
  <g fill="url(#lyraMark)" opacity="0.5">
    <path d="M3260 470l6 20 20 6-20 6-6 20-6-20-20-6 20-6Z"/>
    <path d="M560 1480l5 16 16 5-16 5-5 16-5-16-16-5 16-5Z"/>
    <path d="M2860 1240l4 13 13 4-13 4-4 13-4-13-13-4 13-4Z"/>
    <path d="M1660 300l4 13 13 4-13 4-4 13-4-13-13-4 13-4Z"/>
    <path d="M3560 1120l5 16 16 5-16 5-5 16-5-16-16-5 16-5Z"/>
  </g>

  <!-- Odisseia: rota do barco entre os quatro marcos da jornada, até o
       ponto de chegada junto à marca d'água (o "porto" de origem/casa). -->
  <path fill="none" stroke="@ENT_BORDER@" stroke-width="3" stroke-dasharray="18 16" opacity="0.4"
        d="M260 1780C500 1300 680 760 980 560C1260 380 1500 340 1780 340C2060 340 2260 500 2450 720C2650 940 2840 1000 3000 1120C3140 1230 3230 1420 3300 1650"/>

  <!-- Sereias: canto que tenta desviar os navegantes -->
  <g transform="translate(980 560) scale(1.7)" opacity="0.6">
    <path fill="none" stroke="url(#lyraMark)" stroke-width="7" stroke-linecap="round"
          d="M-26 32C-36 8 -30 -20 -8 -34"/>
    <path fill="none" stroke="url(#lyraMark)" stroke-width="7" stroke-linecap="round"
          d="M26 32C36 8 30 -20 8 -34"/>
    <path fill="url(#lyraMark)" d="M-26 32h52v8h-52z"/>
    <g stroke="url(#lyraMark)" stroke-width="4" stroke-linecap="round">
      <path d="M-14 30V-8M-4 30V-16M4 30V-16M14 30V-8"/>
    </g>
  </g>

  <!-- Ciclope: o olho único de Polifemo -->
  <g transform="translate(1780 340) scale(1.7)" opacity="0.6">
    <path fill="url(#lyraMark)" fill-rule="evenodd"
          d="M-36 0C-17 -22 17 -22 36 0C17 22 -17 22 -36 0Z M0 -12A12 12 0 1 0 0 12A12 12 0 1 0 0 -12Z"/>
  </g>

  <!-- Cila e Caríbdis: a passagem mais estreita e perigosa -->
  <g transform="translate(2450 720) scale(1.6)" opacity="0.55">
    <path fill="url(#lyraMark)" fill-rule="evenodd"
          d="M0 -34A34 34 0 1 0 0 34A34 34 0 1 0 0 -34Z M0 -18A18 18 0 1 1 0 18A18 18 0 1 1 0 -18Z"/>
  </g>

  <!-- Calipso: a última ilha antes do retorno -->
  <g transform="translate(3000 1120) scale(1.8)" opacity="0.6">
    <path fill="@ENT_SURFACE@" d="M-32 22L-6 -20L20 22Z"/>
    <path fill="url(#lyraMark)" d="M4 -34l4 13 13 4-13 4-4 13-4-13-13-4 13-4Z"/>
  </g>

  <!-- O barco, em rota entre as Sereias e o Ciclope -->
  <g transform="translate(1400 460) scale(2.2) rotate(-12)" opacity="0.68">
    <path fill="@ENT_SURFACE@" d="M-46 34L46 34L34 54L-34 54Z"/>
    <path fill="none" stroke="url(#lyraMark)" stroke-width="6" stroke-linecap="round" d="M0 34V-56"/>
    <path fill="url(#lyraMark)" d="M4 -56L46 20L4 20Z"/>
  </g>

  <g transform="translate(3300 1650) scale(2)" opacity="@ENT_WATERMARK_OPACITY@">
    <path fill="url(#lyraMark)" d="M104 190A140 140 0 0 0 199 56 96 96 0 0 1 104 190Z"/>
    <path fill="none" stroke="url(#lyraMark)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
          d="M150 14C118 14 96 34 92 62L92 150C92 166 86 176 76 180 68 183 62 180 60 174"/>
    <g stroke="url(#lyraMark)" stroke-width="4" stroke-linecap="round">
      <path d="M116 46v70M130 46v70M144 46v70M158 46v70"/>
    </g>
    <path fill="url(#lyraMark)" d="M196 18l4 14 14 4-14 4-4 14-4-14-14-4 14-4Z"/>
  </g>
  <text x="3510" y="2100" fill="@ENT_TEXT@" opacity="@ENT_WATERMARK_OPACITY@"
        font-family="sans-serif" font-size="60" font-weight="700" letter-spacing="12"
        text-anchor="middle">1.0</text>
</svg>
